<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: only our own code runs, nothing is fetched from anywhere else.
      If someone ever slipped HTML into the page, it couldn't load a script or send data out.
      frame-ancestors/HSTS can't be set from a meta tag: they live in vercel.json headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <!-- Never disable zoom (mobile-native hard rule 4). interactive-widget: keyboard resizes the layout on Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gastos, orçamento e metas. Tudo fica no seu aparelho." />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS home-screen app (Safari and Chrome on iPhone both use these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Velora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Velora</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Velora precisa de JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
